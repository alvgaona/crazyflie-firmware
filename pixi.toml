# Manifest to build the crazyflie-firmware package with pixi
# See https://pixi.prefix.dev/ for more information about installing and using pixi
#
# Run `pixi shell` to enter a shell with the dependencies available, or `pixi run <command>` to run a command with the dependencies available.

[workspace]
authors = ["Elia Cereda <eliacereda@gmail.com>", "Arnaud Taffanel <arnaud@bitcraze.io>"]
channels = ["conda-forge", "Memfault"]
name = "crazyflie-firmware"
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks]
sitl-configure = "cmake -S sitl_make -B sitl_make/build"
sitl-build = { cmd = "cmake --build sitl_make/build -j", depends-on = ["sitl-configure"] }

[dependencies]
python = ">=3.13,<3.14"

c-compiler = ">=1.11.0,<2"
make = ">=4.4.1,<5"

# STM32 toolchain
xpack-gcc-arm-none-eabi = ">=13.3.1.1.1,<14"
ncurses = ">=6.5,<7"
coreutils = ">=9.5,<10"
sed = ">=4.9,<5"

# SITL (sitl_make/)
cmake = "*"
pkg-config = "*"
jinja2 = "*"

[pypi-dependencies]
cfclient = ">=2025.12.1"

# conda's ld64 can't link against the macOS 26 SDK (libSystem.tbd lists arm64e only), so SITL uses Apple's clang on macOS.
[target.osx-arm64.tasks]
sitl-configure = "cmake -S sitl_make -B sitl_make/build -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++"

[target.osx-64.tasks]
sitl-configure = "cmake -S sitl_make -B sitl_make/build -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++"
